[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-manager"
version = "1.9.0"
description = "Google Drive desktop mount manager for KDE"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]
license = "MIT"

[project.scripts]
drive-manager = "drive_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]
